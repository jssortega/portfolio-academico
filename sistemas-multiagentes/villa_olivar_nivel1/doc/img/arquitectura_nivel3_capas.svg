<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Arquitectura interna de un agente del Nivel 3 — ADK + A2A</title>
  <desc>Cada agente del Nivel 3 se estructura en cuatro capas. Las dos superiores las aporta la clase base BaseAgenteA2A: Transporte (servidor HTTP propio con aiohttp, tarjeta de agente y envoltura JSON-RPC) y Despacho (encamina los métodos JSON-RPC, valida tasks/send contra el contrato e invoca manejar_alerta). Las dos inferiores las aporta cada subclase concreta: Razonamiento (LlmAgent de ADK con instruction y FunctionTool reutilizadas del Nivel 2) y Dominio (funciones puras de logica/).</desc>

  <defs>
    <marker id="flecha-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b3a8a"/>
    </marker>
    <style>
      .titulo { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
      .subtitulo { font-size: 13px; fill: #444; text-anchor: middle; }
      .agente-cont { fill: #fafbfc; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 5; }
      .capa-transporte { fill: #eaf3fb; stroke: #1c5a98; stroke-width: 2; }
      .capa-despacho { fill: #fff8d6; stroke: #b59a00; stroke-width: 2; }
      .capa-razonamiento { fill: #f0eaf7; stroke: #5b3a8a; stroke-width: 2; }
      .capa-dominio { fill: #eaf5ec; stroke: #1e7e34; stroke-width: 2; }
      .capa-titulo { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .capa-detalle { font-size: 12px; fill: #1a1a1a; }
      .flecha { stroke: #5b3a8a; stroke-width: 2; fill: none; }
      .flecha-label { font-size: 11px; font-weight: 600; fill: #5b3a8a; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="780" fill="#ffffff"/>

  <text class="titulo" x="450" y="40" text-anchor="middle">Arquitectura interna de un agente — Nivel 3 (ADK + A2A)</text>
  <text class="subtitulo" x="450" y="62">Las dos capas superiores las aporta BaseAgenteA2A; las dos inferiores, cada subclase del agente.</text>

  <!-- Contenedor exterior del agente -->
  <rect class="agente-cont" x="60" y="90" width="780" height="660" rx="14"/>
  <text x="80" y="118" font-size="14" font-weight="700" fill="#1a1a1a">Agente A2A</text>

  <!-- Capa Transporte -->
  <rect class="capa-transporte" x="120" y="140" width="660" height="130" rx="10"/>
  <text class="capa-titulo" x="450" y="170" fill="#1c5a98">Capa Transporte — la aporta BaseAgenteA2A</text>
  <text class="capa-detalle" x="160" y="200">• Servidor HTTP propio con aiohttp (no se usa a2a-sdk)</text>
  <text class="capa-detalle" x="160" y="220">• Tarjeta de agente publicada en /.well-known/agent.json</text>
  <text class="capa-detalle" x="160" y="240">• Envoltura JSON-RPC 2.0 sobre el extremo POST /</text>
  <text class="capa-detalle" x="160" y="260">• SSE para streaming (tasks/sendSubscribe)</text>

  <!-- Flecha Transporte → Despacho -->
  <line class="flecha" x1="450" y1="270" x2="450" y2="310" marker-end="url(#flecha-down)"/>
  <text class="flecha-label" x="520" y="295">petición JSON-RPC</text>

  <!-- Capa Despacho -->
  <rect class="capa-despacho" x="120" y="320" width="660" height="100" rx="10"/>
  <text class="capa-titulo" x="450" y="350" fill="#7a5b00">Capa Despacho — la aporta BaseAgenteA2A</text>
  <text class="capa-detalle" x="160" y="380">• Encamina cada método JSON-RPC (tasks/send, tasks/get…)</text>
  <text class="capa-detalle" x="160" y="400">• Valida la AlertaEmergencia e invoca manejar_alerta</text>

  <!-- Flecha Despacho → Razonamiento -->
  <line class="flecha" x1="450" y1="420" x2="450" y2="460" marker-end="url(#flecha-down)"/>
  <text class="flecha-label" x="520" y="445">manejar_alerta</text>

  <!-- Capa Razonamiento -->
  <rect class="capa-razonamiento" x="120" y="470" width="660" height="130" rx="10"/>
  <text class="capa-titulo" x="450" y="500" fill="#5b3a8a">Capa Razonamiento — cada subclase (preservada del Nivel 2)</text>
  <text class="capa-detalle" x="160" y="530">• LlmAgent de ADK</text>
  <text class="capa-detalle" x="160" y="550">• instruction (heredada de prompts/{rol}.txt del Nivel 2)</text>
  <text class="capa-detalle" x="160" y="570">• FunctionTool (reutilizadas del Nivel 2)</text>
  <text class="capa-detalle" x="160" y="590">• Ollama (o Gemini) vía LiteLLM</text>

  <!-- Flecha Razonamiento → Dominio -->
  <line class="flecha" x1="450" y1="600" x2="450" y2="640" marker-end="url(#flecha-down)"/>
  <text class="flecha-label" x="510" y="625">invocación</text>

  <!-- Capa Dominio -->
  <rect class="capa-dominio" x="120" y="650" width="660" height="80" rx="10"/>
  <text class="capa-titulo" x="450" y="680" fill="#1e7e34">Capa Dominio — logica/ (preservada del Nivel 1)</text>
  <text class="capa-detalle" x="160" y="708">• logica/*.py — funciones puras, sin dependencias de frameworks</text>
</svg>
