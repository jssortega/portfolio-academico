<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520"
     font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-sol-iny-n3" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-ret-iny-n3" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#0f172a"
            stroke-width="1.3"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #475569; }
    .lifeline-label { font-size: 13px; font-weight: 600;
                       fill: #0f172a; text-anchor: middle; }
    .msg-label { font-size: 12px; fill: #0f172a; }
    .msg-meta  { font-size: 10.5px; fill: #475569;
                  font-style: italic; }
    .plazo     { font-size: 10.5px; fill: #b45309;
                  font-weight: 600; }
    .ll-head-sup { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .ll-head-cen { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .ll-line     { stroke: #94a3b8; stroke-width: 1;
                    stroke-dasharray: 4 3; }
    .nota        { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1; }
    .nota-traza  { fill: #ecfccb; stroke: #65a30d; stroke-width: 1; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" class="title">
    Protocolo 1 · Inyección de alertas (HTTP / A2A)
  </text>
  <text x="380" y="50" text-anchor="middle" class="subtitle">
    Iniciador: Supervisor · Destino único: Centralita pública del grupo
  </text>

  <!-- Cabezas de las dos líneas de vida -->
  <rect x="100" y="70" width="200" height="42" rx="6"
        class="ll-head-sup"/>
  <text x="200" y="96" class="lifeline-label">Supervisor</text>

  <rect x="460" y="70" width="200" height="42" rx="6"
        class="ll-head-cen"/>
  <text x="560" y="96" class="lifeline-label">
    Centralita pública
  </text>

  <line x1="200" y1="112" x2="200" y2="490" class="ll-line"/>
  <line x1="560" y1="112" x2="560" y2="490" class="ll-line"/>

  <!-- (1) HTTP POST tasks/send con AlertaEmergencia -->
  <line x1="200" y1="160" x2="555" y2="160" stroke="#0f172a"
        stroke-width="1.6" marker-end="url(#arrow-sol-iny-n3)"/>
  <text x="378" y="152" text-anchor="middle" class="msg-label">
    (1) HTTP POST {url_centralita}/a2a · tasks/send
  </text>
  <text x="378" y="178" text-anchor="middle" class="msg-meta">
    DataPart = AlertaEmergencia (id_emergencia + hito_evaluado + coordinacion)
  </text>

  <!-- Banda intermedia: actuación interna -->
  <rect x="380" y="210" width="360" height="74" rx="6"
        class="nota"/>
  <text x="560" y="234" text-anchor="middle" class="msg-meta">
    La Centralita coordina a sus especialistas
  </text>
  <text x="560" y="250" text-anchor="middle" class="msg-meta">
    públicos y privados (no observable desde fuera).
  </text>
  <text x="560" y="270" text-anchor="middle" class="msg-meta">
    Cada paso debe quedar registrado en la traza.
  </text>

  <!-- (2) HTTP 200 con InformeResolucion -->
  <line x1="555" y1="340" x2="205" y2="340" stroke="#0f172a"
        stroke-width="1.6" marker-end="url(#arrow-ret-iny-n3)"/>
  <text x="380" y="332" text-anchor="middle" class="msg-label">
    (2) HTTP 200 · Task completed
  </text>
  <text x="380" y="356" text-anchor="middle" class="msg-meta">
    DataPart = InformeResolucion (con traza_participacion)
  </text>
  <text x="600" y="352" class="plazo">≤ 180 s desde (1)</text>

  <!-- Nota destacada de traza_participacion -->
  <rect x="60" y="395" width="640" height="68" rx="6"
        class="nota-traza"/>
  <text x="380" y="418" text-anchor="middle" class="msg-label">
    El InformeResolucion DEBE incluir traza_participacion
  </text>
  <text x="380" y="436" text-anchor="middle" class="msg-meta">
    Lista ordenada de eventos con (instante, agente_id, rol, visibilidad, accion, detalle).
  </text>
  <text x="380" y="452" text-anchor="middle" class="msg-meta">
    Es la evidencia que el supervisor usa para validar los hitos de evaluación.
  </text>

  <!-- Variantes negativas, en pie -->
  <text x="200" y="490" class="msg-meta">
    Variantes (penalizadas): Task failed · timeout HTTP · JSON inválido · traza ausente o vacía
  </text>
</svg>
