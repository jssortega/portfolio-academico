<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620"
     font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-sol-col" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-ret-col" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#0f172a"
            stroke-width="1.3"/>
    </marker>
    <marker id="arrow-grp" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #475569; }
    .lifeline-label { font-size: 13px; font-weight: 600;
                       fill: #0f172a; text-anchor: middle; }
    .msg-label { font-size: 12px; fill: #0f172a; }
    .msg-meta  { font-size: 10.5px; fill: #475569;
                  font-style: italic; }
    .plazo     { font-size: 10.5px; fill: #b45309;
                  font-weight: 600; }
    .ll-head-sup { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .ll-head-cen { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .ll-line     { stroke: #94a3b8; stroke-width: 1;
                    stroke-dasharray: 4 3; }
    .nota        { fill: #ecfccb; stroke: #65a30d; stroke-width: 1; }
    .canal-inter { stroke: #16a34a; stroke-width: 1.4;
                   stroke-dasharray: 6 4; }
    .ventana     { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1;
                   stroke-dasharray: 3 2; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" class="title">
    Inyección colaborativa multi-grupo · Protocolo 1 sobre varias Centralitas
  </text>
  <text x="440" y="50" text-anchor="middle" class="subtitle">
    Mismo escenario lanzado a N grupos dentro de una ventana acotada
  </text>

  <!-- Tres líneas de vida -->
  <rect x="60" y="70" width="200" height="42" rx="6"
        class="ll-head-sup"/>
  <text x="160" y="96" class="lifeline-label">Supervisor</text>

  <rect x="340" y="70" width="200" height="42" rx="6"
        class="ll-head-cen"/>
  <text x="440" y="96" class="lifeline-label">
    Centralita pública · Grupo A
  </text>

  <rect x="620" y="70" width="200" height="42" rx="6"
        class="ll-head-cen"/>
  <text x="720" y="96" class="lifeline-label">
    Centralita pública · Grupo B
  </text>

  <line x1="160" y1="112" x2="160" y2="590" class="ll-line"/>
  <line x1="440" y1="112" x2="440" y2="590" class="ll-line"/>
  <line x1="720" y1="112" x2="720" y2="590" class="ll-line"/>

  <!-- Ventana colaborativa (banda amarilla) -->
  <rect x="280" y="135" width="560" height="80" rx="6"
        class="ventana"/>
  <text x="560" y="155" text-anchor="middle" class="msg-meta">
    Ventana colaborativa (por defecto ≤ 2 s)
  </text>

  <!-- (1) HTTP POST a Grupo A -->
  <line x1="160" y1="180" x2="435" y2="180" stroke="#0f172a"
        stroke-width="1.6" marker-end="url(#arrow-sol-col)"/>
  <text x="298" y="172" text-anchor="middle" class="msg-label">
    (1) tasks/send · AlertaEmergencia
  </text>
  <text x="298" y="195" text-anchor="middle" class="msg-meta">
    coordinacion = ["A","B"]
  </text>

  <!-- (1') HTTP POST a Grupo B -->
  <line x1="160" y1="205" x2="715" y2="205" stroke="#0f172a"
        stroke-width="1.6" marker-end="url(#arrow-sol-col)"/>

  <!-- Banda intermedia: cooperación A↔B -->
  <rect x="280" y="245" width="560" height="120" rx="6"
        class="nota"/>
  <text x="560" y="268" text-anchor="middle" class="msg-meta">
    Cooperación entre Centralitas (canal libre, no observado por el supervisor):
  </text>
  <text x="560" y="285" text-anchor="middle" class="msg-meta">
    intercambio de cobertura, reparto de recursos, confirmación de hipótesis.
  </text>

  <!-- Flechas entre A y B (canal inter-grupo) -->
  <line x1="440" y1="310" x2="715" y2="310" class="canal-inter"
        marker-end="url(#arrow-grp)"/>
  <line x1="720" y1="335" x2="445" y2="335" class="canal-inter"
        marker-end="url(#arrow-grp)"/>
  <text x="580" y="358" text-anchor="middle" class="msg-meta">
    Cada interacción inter-grupo debe quedar reflejada en la traza de cada informe.
  </text>

  <!-- (2) Informe del Grupo A -->
  <line x1="435" y1="420" x2="165" y2="420" stroke="#0f172a"
        stroke-width="1.6" marker-end="url(#arrow-ret-col)"/>
  <text x="300" y="412" text-anchor="middle" class="msg-label">
    (2) HTTP 200 · InformeResolucion (A)
  </text>
  <text x="300" y="435" text-anchor="middle" class="msg-meta">
    traza_participacion con interacciones a Grupo B
  </text>
  <text x="40" y="437" class="plazo">≤ 180 s desde (1)</text>

  <!-- (3) Informe del Grupo B -->
  <line x1="715" y1="490" x2="165" y2="490" stroke="#0f172a"
        stroke-width="1.6" marker-end="url(#arrow-ret-col)"/>
  <text x="440" y="482" text-anchor="middle" class="msg-label">
    (3) HTTP 200 · InformeResolucion (B)
  </text>
  <text x="440" y="506" text-anchor="middle" class="msg-meta">
    traza_participacion con interacciones a Grupo A
  </text>
  <text x="40" y="507" class="plazo">≤ 180 s desde (1')</text>

  <!-- Pie -->
  <text x="60" y="555" class="msg-meta">
    El supervisor abre un seguimiento por (escenario, grupo). El criterio de coherencia colaborativa
  </text>
  <text x="60" y="572" class="msg-meta">
    se evalúa cruzando las dos trazas: deben ser consistentes (mismo id_emergencia, evidencias compatibles).
  </text>
  <text x="60" y="592" class="msg-meta">
    Variantes (penalizadas): un grupo no responde · trazas incoherentes · ausencia de interacciones inter-grupo en la traza.
  </text>
</svg>
