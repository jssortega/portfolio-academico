<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480"
     font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-sol-iny" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-ret-iny" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#0f172a"
            stroke-width="1.3"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #475569; }
    .lifeline-label { font-size: 13px; font-weight: 600;
                       fill: #0f172a; text-anchor: middle; }
    .msg-label { font-size: 12px; fill: #0f172a; }
    .msg-meta  { font-size: 10.5px; fill: #475569;
                  font-style: italic; }
    .plazo     { font-size: 10.5px; fill: #b45309;
                  font-weight: 600; }
    .ll-head-sup { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .ll-head-cen { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .ll-line     { stroke: #94a3b8; stroke-width: 1;
                    stroke-dasharray: 4 3; }
    .nota        { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1; }
  </style>

  <!-- Fondo claro para legibilidad sobre temas oscuros -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" class="title">
    Protocolo 1 · Inyección de incidentes (fipa-request)
  </text>
  <text x="380" y="50" text-anchor="middle" class="subtitle">
    Iniciador: Supervisor · Destinatario: Centralita del grupo
  </text>

  <!-- Cabezas de las dos líneas de vida -->
  <rect x="100" y="70" width="200" height="42" rx="6"
        class="ll-head-sup"/>
  <text x="200" y="96" class="lifeline-label">Supervisor</text>

  <rect x="460" y="70" width="200" height="42" rx="6"
        class="ll-head-cen"/>
  <text x="560" y="96" class="lifeline-label">
    Centralita del grupo
  </text>

  <!-- Líneas de vida -->
  <line x1="200" y1="112" x2="200" y2="440" class="ll-line"/>
  <line x1="560" y1="112" x2="560" y2="440" class="ll-line"/>

  <!-- (1) request DatosEmergencia -->
  <line x1="200" y1="160" x2="555" y2="160" stroke="#0f172a"
        stroke-width="1.6" marker-end="url(#arrow-sol-iny)"/>
  <text x="378" y="152" text-anchor="middle" class="msg-label">
    (1) request · DatosEmergencia
  </text>
  <text x="378" y="178" text-anchor="middle" class="msg-meta">
    conversation_id = nuevo UUID
  </text>

  <!-- (2) agree -->
  <line x1="555" y1="220" x2="205" y2="220" stroke="#0f172a"
        stroke-width="1.6" marker-end="url(#arrow-ret-iny)"
        stroke-dasharray="0"/>
  <text x="380" y="212" text-anchor="middle" class="msg-label">
    (2) agree · (cuerpo vacío)
  </text>
  <text x="600" y="232" class="plazo">≤ 5 s</text>

  <!-- Banda intermedia: actuación interna -->
  <rect x="380" y="260" width="360" height="58" rx="6"
        class="nota"/>
  <text x="560" y="282" text-anchor="middle" class="msg-meta">
    Actuación interna del grupo entre sus
  </text>
  <text x="560" y="298" text-anchor="middle" class="msg-meta">
    propios agentes (no la observa el supervisor).
  </text>

  <!-- (3) inform InformeResolucion -->
  <line x1="555" y1="370" x2="205" y2="370" stroke="#0f172a"
        stroke-width="1.6" marker-end="url(#arrow-ret-iny)"/>
  <text x="380" y="362" text-anchor="middle" class="msg-label">
    (3) inform · InformeResolucion
  </text>
  <text x="380" y="386" text-anchor="middle" class="msg-meta">
    conversation_id = el del request
  </text>
  <text x="600" y="382" class="plazo">≤ 180 s desde (2)</text>

  <!-- Variantes negativas, en pie -->
  <text x="200" y="440" class="msg-meta">
    Variantes (penalizadas): refuse · not-understood · timeout · cuerpo no interpretable
  </text>
</svg>
