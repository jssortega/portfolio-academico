<?xml version="1.0" encoding="UTF-8"?>
<!--
  Árbol de directorios. Texto monoespaciado sobre fondo claro.
  Sin color como portador de información; sólo gris suave para los
  comentarios, suficiente contraste sobre blanco.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480"
     font-family="JetBrains Mono, Menlo, Consolas, monospace"
     font-size="13" role="img"
     aria-label="Estructura de directorio tests/ontologia/">
  <title>Estructura propuesta del directorio tests/ontologia/</title>
  <defs>
    <style>
      .fondo   { fill: #ffffff; stroke: #cccccc; stroke-width: 1; }
      .marco   { fill: #f7f7f7; stroke: #555555; stroke-width: 1.5; rx: 10; ry: 10; }
      .raiz    { font-weight: 700; fill: #111111; }
      .file    { fill: #111111; }
      .coment  { fill: #555555; font-style: italic; }
    </style>
  </defs>

  <rect class="fondo" x="0" y="0" width="720" height="480"/>
  <rect class="marco" x="10" y="10" width="700" height="460"/>

  <text class="raiz"   x="30" y="40">tests/</text>
  <text class="raiz"   x="30" y="62">└── ontologia/</text>
  <text class="file"   x="30" y="84">    ├── __init__.py</text>
  <text class="file"   x="30" y="106">    ├── conftest.py</text>
  <text class="coment" x="320" y="106">         # helpers de fabricación</text>
  <text class="file"   x="30" y="128">    ├── test_enumeraciones.py</text>
  <text class="coment" x="320" y="128">         # §4.1</text>
  <text class="file"   x="30" y="150">    ├── test_datos_emergencia.py</text>
  <text class="coment" x="320" y="150">         # §4.2</text>
  <text class="file"   x="30" y="172">    ├── test_respuesta_agente.py</text>
  <text class="coment" x="320" y="172">         # §4.3</text>
  <text class="file"   x="30" y="194">    ├── test_informe_resolucion.py</text>
  <text class="coment" x="320" y="194">         # §4.4</text>
  <text class="file"   x="30" y="216">    ├── test_consulta_estado_y_estado_agente.py</text>
  <text class="coment" x="430" y="216"> # §4.5</text>
  <text class="file"   x="30" y="238">    ├── test_coherencia_json_schema.py</text>
  <text class="coment" x="320" y="238">         # §4.6</text>
  <text class="file"   x="30" y="260">    ├── test_compatibilidad_supervisor.py</text>
  <text class="coment" x="380" y="260">  # §5</text>
  <text class="file"   x="30" y="282">    ├── test_adk_tool_calling.py</text>
  <text class="coment" x="320" y="282">         # §6.1</text>
  <text class="file"   x="30" y="304">    ├── test_a2a.py</text>
  <text class="coment" x="320" y="304">         # §6.2</text>
  <text class="file"   x="30" y="326">    └── test_mcp.py</text>
  <text class="coment" x="320" y="326">         # §6.3</text>

  <text class="coment" x="30" y="386">11 ficheros en total, todos sin SPADE ni red.</text>
  <text class="coment" x="30" y="408">Tiempo total objetivo de la suite: &lt; 5 segundos.</text>
  <text class="coment" x="30" y="430">Patrón: Arrange / Act / Assert con accesorios de fabricación.</text>
</svg>
