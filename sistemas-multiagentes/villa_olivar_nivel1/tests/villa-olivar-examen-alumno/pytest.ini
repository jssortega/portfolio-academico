[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
# Añade la raíz del proyecto al ``sys.path`` para que `import
# cliente_pruebas`, `import contrato` y los demás paquetes locales
# funcionen desde cualquier subdirectorio de tests sin necesidad
# de hooks ad hoc en ``conftest.py``.
pythonpath = .
# Suprime el traceback de cada fallo durante la ejecución. El
# detalle accionable de cada incidencia (motivo y pasos de
# corrección concretos) se imprime al final en la tabla resumen
# que produce ``tests/conftest.py``, lo bastante para diagnosticar
# la mayoría de los problemas frecuentes del alumno sin necesidad
# de leer el traceback. Para ver la traza completa de un test
# concreto al diagnosticar un caso atípico:
#   pytest --tb=long <ruta>::<Clase>::<test>
addopts = --tb=no --no-header -rN
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:pydantic.*

# Etiquetas (markers) registradas para que pytest no emita avisos de
# "unknown mark" al lanzarlas con -m. Se documentan en tests/README.md.
markers =
    integration: prueba que arranca agentes A2A reales contra el registro REST del perfil activo. Se omite con `pytest -m "not integration"` cuando no hay registro disponible.
    hito_1: prueba asociada al Hito 1 de `doc/HITOS_EVALUACION.md` (Infraestructura A2A y primer agente: Agent Card, servidor HTTP en la IP del aula, `tasks/send` básico).
    hito_2: prueba asociada al Hito 2 (Tres agentes públicos con comunicación A2A).
    hito_3: prueba asociada al Hito 3 (Cinco agentes con coordinación completa intra-grupo).
    hito_4: prueba asociada al Hito 4 (Contract Net y respuesta al coordinador del profesor).
    hito_5: prueba asociada al Hito 5 (Interoperabilidad y cooperación cruzada entre grupos).
    hito_6: prueba asociada al Hito 6 (Excelencia y robustez).
