# =============================================================================
# Catálogo de incidencias del supervisor — Villa Olivar (Nivel 2)
# =============================================================================
# Catálogo cerrado y reproducible de incidencias que el supervisor del
# profesor inyecta a las Centralitas de los grupos durante la corrección.
#
# Reglas del catálogo:
# - Cada entrada DEBE llevar una `clave` única (snake_case). Esa clave es
#   la semilla del UUID v5 que genera el `id_emergencia`, de modo que el
#   identificador es determinista: dos arranques producen el mismo id.
# - `tipo_emergencia` debe coincidir con los valores del enumerado
#   TipoEmergencia (ontologia/modelos_compartidos.py):
#     incendio | derrame_quimico | accidente_trafico | inundacion |
#     derrumbe | otro
# - `prioridad` debe coincidir con los valores del enumerado Prioridad:
#     baja | media | alta | critica
# - El orden de las entradas y sus claves forman parte del contrato
#   público del supervisor (ver caracteristicas_para_tests_grupo.md §6):
#   añadir entradas al final NO rompe a los grupos; reordenar o renombrar
#   sí. No tocar las 8 primeras claves: las usa el modo demo.
# - `ubicacion` y `descripcion` son texto libre en español. Se inyectan
#   tal cual al cuerpo del mensaje `request` (FIPA-ACL) que recibe la
#   Centralita del grupo.

incidencias:

  # ─── Claves originales del modo demo (NO renombrar) ───────────────────────
  - clave: "incendio_alta"
    tipo_emergencia: "incendio"
    prioridad: "alta"
