[pytest]
asyncio_mode = auto

# Etiquetas (markers) registradas para que pytest no emita avisos de
# "unknown mark" al lanzarlas con -m. Se documentan en tests/README.md.
markers =
    integration: prueba que arranca agentes SPADE reales contra el servidor XMPP del perfil activo. Se omite con `pytest -m "not integration"` cuando no hay servidor disponible.
